# https://taskfile.dev

version: '3'

tasks:
  build:
    desc: "Build wtr into bin/"
    cmds:
      - go build -o bin/wtr .

  test:
    desc: "Vet the code and run the tests with the race detector"
    cmds:
      - go vet ./...
      - go test -race ./...

  install:
    desc: "Install wtr into $GOBIN, or ~/go/bin"
    vars:
      GOBIN:
        sh: go env GOBIN | grep . || echo "$(go env GOPATH)/bin"
    cmds:
      # Not go install, which names the binary after the module, watcheroo.
      - go build -o "{{.GOBIN}}/wtr" .

  docs:
    desc: "Write the command reference into docs/"
    cmds:
      - go run ./cmd/docs --dir docs
